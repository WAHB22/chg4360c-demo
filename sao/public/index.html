<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SAO</title>
  <link rel="stylesheet" href="/vendor/cinzel/600.css">
  <link rel="stylesheet" href="/vendor/cinzel/700.css">
  <link rel="stylesheet" href="/vendor/alegreya/500.css">
  <link rel="stylesheet" href="/vendor/alegreya/700.css">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="world" aria-label="SAO world. Use the Index button to reach every place with the keyboard."></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header id="top">
    <div class="frame brand"><div class="in">
      <span class="name">SAO</span>
      <span class="mock">mock data</span>
    </div></div>
    <div class="actions">
      <button id="indexBtn" class="chip" aria-expanded="false" aria-controls="index">Index</button>
      <button id="usageBtn" class="chip" role="switch" aria-checked="false">Usage: normal</button>
    </div>
  </header>

  <div id="resting" class="frame warn" hidden><div class="in">ICON is resting. Claude usage is limited, so new orders wait in the queue until it resets.</div></div>

  <nav id="index" class="frame" hidden aria-label="Every place in SAO"><div class="in"></div></nav>

  <aside id="legend" class="frame" aria-label="Legend"><div class="in">
    <span><i class="dot working"></i>Working</span>
    <span><i class="dot blocked"></i>Blocked</span>
    <span><i class="dot waiting"></i>Waiting on you</span>
    <span><i class="diamond"></i>Needs your OK</span>
  </div></aside>

  <section id="panel" class="frame" hidden aria-labelledby="pName"><div class="in">
    <header class="ph">
      <span id="pKind" class="kind"></span>
      <h2 id="pName"></h2>
      <p id="pTitle"></p>
      <button id="pClose" class="x" aria-label="Close panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="status" aria-selected="true">Status</button>
      <button role="tab" data-tab="queue" aria-selected="false">Queue</button>
      <button role="tab" data-tab="orders" aria-selected="false">Orders</button>
      <button role="tab" data-tab="memory" aria-selected="false">Memory</button>
    </div>
    <div id="pBody" class="pb" role="tabpanel"></div>
    <form id="orderForm" class="order">
      <label for="orderText">Order or suggestion</label>
      <textarea id="orderText" rows="2" placeholder="Tell this place what to do next"></textarea>
      <div class="row">
        <button type="submit" class="go" data-mode="order">Run order</button>
        <button type="button" class="ghost" data-mode="suggest">Suggest</button>
      </div>
      <p class="note">Phase 1 preview: orders are simulated. Phase 2 makes them real.</p>
    </form>
  </div></section>

  <script type="module" src="/ui.js"></script>
</body>
</html>
