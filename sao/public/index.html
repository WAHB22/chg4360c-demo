<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1B2230">
<meta name="description" content="SAO, a calm painted valley where your bots quietly take care of things.">
<title>SAO</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23F3EFE6' stroke='%23E8C88E' stroke-width='2'/%3E%3Cpath d='M16 7l3 9-3 9-3-9z' fill='none' stroke='%231B2A44' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/ui.css">
</head>
<body>
<a class="skip" href="#map">Skip to the map</a>
<div class="app">
  <div class="world" id="world">
    <!-- keyboard order: status, menu, vista places, map towns, panels -->
    <div class="hud" id="hud"></div>
    <main class="vista" id="vista" aria-label="The vista: the place you are at"></main>
    <div class="caption-slot" id="caption-slot"></div>
    <div class="world-error glass" id="world-error" role="alert" hidden>
      <p class="world-error-text">No world to show yet. Start the engine on your machine, then reload.</p>
      <button class="btn btn-primary" type="button" id="world-retry">Try again</button>
    </div>
  </div>
  <section class="mapband" id="map" aria-label="Map of the island" tabindex="-1">
    <div class="map-host" id="map-host"></div>
    <div class="map-bar">
      <p class="map-hint">Choose a place to travel there</p>
      <button class="btn" type="button" id="map-close">Back to the vista</button>
    </div>
  </section>
  <div class="dock-slot" id="dock-slot"></div>
</div>
<noscript><p class="noscript">SAO needs JavaScript to draw the world.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
